
# SEALY - GitHub Pages Deployment
# The seals have officially entered the internet.

name: Deploy Sealy

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build & Deploy Sealy
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Get the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install dependencies from package-lock.json
      - name: Install dependencies
        run: npm ci

      # Build React + TypeScript + Vite
      - name: Build Sealy
        run: npm run build

      # Configure GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Upload the compiled website
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # Publish Sealy
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
